/* Layout: one portrait 9:16 stage, centred, with a slim control row under it. Single dark walnut look. */
:root {
  color-scheme: dark;
  --bg: #0c0705;
  --panel: #1b110b;
  --fg: #f3e6cf;
  --muted: #bfa77f;
  --gold: #d4a84d;
  --gold-hi: #f1d48a;
  --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  margin: 0;
  padding-inline: 16px;
  padding-block: 12px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  overflow: hidden;
}
#wrap { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
#stage { position: relative; max-width: 100%; }
#film {
  display: block; width: 100%; height: 100%;
  border-radius: 14px;
  box-shadow: 0 0 0 1px rgba(212, 168, 77, 0.35), 0 18px 60px rgba(0, 0, 0, 0.6);
  background: #000;
}
#cover {
  position: absolute; inset: 0;
  display: grid; place-items: end center; padding-bottom: 7%; box-sizing: border-box;
  background: radial-gradient(circle at 50% 50%, rgba(12, 7, 5, 0) 30%, rgba(12, 7, 5, 0.55) 100%);
  border-radius: 14px;
}
#bigplay {
  font: 700 clamp(18px, 2.6vh, 26px) / 1.1 var(--font-body);
  color: #1a0f07;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold));
  border: 0;
  border-radius: 999px;
  padding: 0.9em 1.6em;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 0.6em;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}
#bigplay svg { width: 1em; height: 1em; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.bar button {
  font: 700 16px/1 var(--font-body);
  color: var(--fg);
  background: var(--panel);
  border: 1px solid rgba(212, 168, 77, 0.45);
  border-radius: 999px;
  padding: 11px 18px;
  min-height: 44px;
  cursor: pointer;
}
.bar button:hover { border-color: var(--gold-hi); }
button:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

  <div id="stage">

    <div id="cover">

      </button>
    </div>
  </div>
</div>

</div>

<script>
(() => {
"use strict";
const PW = 1080, PH = 1920;
let MODE = "portrait", W = PW, H = PH;
// Where things sit in each frame shape
const LAYOUTS = {
  portrait: { cx: 540, galY: 860, galR: 270, ledgeY: 1168, introCapY: 1430, cardY: 860, logoY: 820, tagY: 1110, soonY: 1236, cap: { x: 540, y: 150, wrap: 980 }, game: null },
  landscape: { cx: 960, galY: 430, galR: 250, ledgeY: 700, introCapY: 880, cardY: 480, logoY: 400, tagY: 690, soonY: 810, cap: { x: 590, y: 440, wrap: 800 }, game: { sx: 130, sy: 330, sw: 820, sh: 1580, dx: 1120, dy: 20, dh: 1040 } },
};

const TAU = Math.PI * 2;

const easeInOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
